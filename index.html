<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pitaka — Personal Finance</title>
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Pitaka" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before the page draws, so it never flashes the wrong colours.
    (function () {
      var t = localStorage.getItem('pitaka-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <span class="brand" data-icon="wallet">Pitaka</span>
      <nav class="nav">
        <button class="nav-btn" data-view="dashboard" data-icon="home"><span>Home</span></button>
        <button class="nav-btn" data-view="income" data-icon="income"><span>Income</span></button>
        <button class="nav-btn" data-view="expenses" data-icon="expense"><span>Expenses</span></button>
        <button class="nav-btn" data-view="budgets" data-icon="budget"><span>Budgets</span></button>
        <button class="nav-btn" data-view="goals" data-icon="piggy"><span>Goals</span></button>
        <button class="nav-btn" data-view="bills" data-icon="bills"><span>Bills</span></button>
        <button class="nav-btn" data-view="rewards" data-icon="star"><span>Rewards</span></button>
        <button class="nav-btn" data-view="summary" data-icon="summary"><span>Summary</span></button>
        <button class="nav-btn nav-settings" data-view="settings" data-icon="settings"><span>Settings</span></button>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="topbar">
      <h1 id="view-title">Home</h1>
      <div class="topbar-right">
        <div class="month-picker" id="month-picker">
          <button class="icon-btn" data-action="prev-month" data-icon="left" aria-label="Previous month"></button>
          <input type="month" id="month-input" aria-label="Month" />
          <button class="icon-btn" data-action="next-month" data-icon="right" aria-label="Next month"></button>
        </div>
        <button class="icon-btn theme-btn" data-action="toggle-theme" id="theme-btn" aria-label="Switch light or dark mode"></button>
        <button class="icon-btn mobile-only" data-view="settings" data-icon="settings" aria-label="Settings"></button>
      </div>
    </div>
    <div id="alerts"></div>
    <section id="view"></section>
  </main>

  <button class="fab" data-action="quick-add" data-icon="plus" aria-label="Quick add"></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <input type="file" id="receipt-file" accept="image/*" hidden />
  <script src="icons.js"></script>
  <script src="receipt.js"></script>
  <script src="rewards.js"></script>
  <script src="goals.js"></script>
  <script src="share.js"></script>
  <script src="app.js"></script>
</body>
</html>
